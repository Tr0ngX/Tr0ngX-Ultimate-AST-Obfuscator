name: Tr0ngX Obfuscator CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Matrix (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            setup.py

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pystyle || true

      - name: Verify CLI Interface
        run: |
          python tr0ngx_obfuscator.py --help || true

      - name: Run Native Test Suites
        run: |
          python tests/test_01_core_features.py
          python tests/test_02_crypto_math.py
          python tests/test_03_data_structures.py
          python tests/test_04_dynamic_reflection.py
          python complex_benchmark.py

      - name: Run End-to-End Obfuscation & Stress Matrix Tests
        run: |
          python tests/run_all_tests.py
